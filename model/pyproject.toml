[project]
name = "samarth-model"
version = "0.1.0"
description = "Risk scoring, cue extraction and alert ranking for Samarth Sentinel"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["samarth_model*", "evaluation*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
